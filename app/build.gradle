apply plugin: 'com.android.application'

android {
    // API 31 基线。AGP 4.1.3 也会跑 checkDebugAarMetadata，所以依赖一旦越过 31 那一档
    // 就会在构建期报错，版本号不是随手选的（见下方 dependencies）。
    compileSdkVersion 31

    defaultConfig {
        applicationId "com.documentscanner"
        minSdkVersion 24
        targetSdkVersion 31
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // OpenCV 的 native 库按 ABI 打包，只保留实际需要的，避免 APK 体积翻倍
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        // 构建跑在 JDK 17 上，但语言级别仍是 1.8：AGP 4.1.3 自带的 D8 读不了 major 61
        // 字节码，把 source/target 提到 17 会在 dex 阶段重演 OpenCV 4.11 那个坑。
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }

    sourceSets {
        // 与 :scanner 共用同一份 SessionFixtures 源码（详见模块里的同名配置）：
        // 宿主的首页历史列表用例要造会话，而脚手架只该存在一份。
        androidTest.java.srcDirs += '../scanner/src/androidTestShared/java'
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    // 文档扫描组件：算法、相机、会话、导出与四屏 UI 全在里面（B1-B4）
    implementation project(':scanner')

    // 这里只剩宿主自己的首页要用的那几件。opencv / CameraX / guava 不再出现在这份清单里：
    // :scanner 用 implementation 作用域引它们，宿主编译期拿不到这些类（B5 会加一条断言核这个），
    // 运行期照样打进 APK。
    // 版本停在 API 31 同期那一档（2021-11 ~ 2022-02）：这几个 AAR 的 minCompileSdk 都是 31，
    // checkDebugAarMetadata 在 compileSdk=31 下实测能过。再往上普遍就不行了
    // （appcompat 1.5 → 32、camera 1.2 → 33、recyclerview 1.3 → 33）；core 1.8 与
    // activity 1.5 的 metadata 虽仍写 31，但已属 32/33 世代的库，这里不追。
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'androidx.activity:activity:1.4.0'
    implementation 'androidx.core:core:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'com.google.android.material:material:1.5.0'

    testImplementation 'junit:junit:4.13.2'
    // instrumentation 这一套不跟着降级：它们的 AAR 不声明 minCompileSdk，compileSdk 31 下
    // 照样过 check*AarMetadata。留着 1.5.x 是实测结论：三件（core / runner / ext:junit）一起
    // 退回 1.4.0 世代时，23 个走 ActivityScenario 的用例全部卡在 PRE_ON_CREATE（Android 15
    // 真机，无崩溃日志），15 分钟才跑完；单独退任何一件都复现不了。差别在 androidx.test:monitor
    // ——单退一件时它仍被同伴拉到 1.6.1，三件同退才落到 1.4.0。
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    // AndroidJUnitRunner：ScanSession 的落盘/恢复依赖真实 Context，只能在 instrumentation 里跑
    androidTestImplementation 'androidx.test:runner:1.5.2'
    // ActivityScenario：首页历史列表要在真实 Activity 里跑一遍
    androidTestImplementation 'androidx.test:core:1.5.0'
}

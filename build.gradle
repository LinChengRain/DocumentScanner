buildscript {
    repositories {
        if (project.findProperty('useChineseMirror') != 'false') {
            // 国内网络较慢时加速；海外贡献者用 -PuseChineseMirror=false 或改 gradle.properties 关闭
            maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.1.3'
    }
}

allprojects {
    repositories {
        if (project.findProperty('useChineseMirror') != 'false') {
            maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        }
        google()
        mavenCentral()
    }
}

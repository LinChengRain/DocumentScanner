name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Unit tests + debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v4
        with:
          # 不走 wrapper：distributionUrl 指向腾讯镜像（面向国内贡献者），
          # 海外 runner 直连官方源更快，且与 AGP 4.1.3 的实测组合保持一致
          gradle-version: '7.6.4'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests
        run: gradle --no-daemon -PuseChineseMirror=false :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon -PuseChineseMirror=false :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

apply plugin: 'com.android.application'

def cameraXVersion = '1.3.1'

android {
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.documentscanner"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // OpenCV 的 native 库按 ABI 打包，只保留实际需要的，避免 APK 体积翻倍
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    // 文档边缘检测 / 透视矫正 / 图像增强
    // 4.12 起 arm64 构建会按 HWCAP 派发到 SVE 内核；Android 模拟器（Apple 芯片 +
    // Hypervisor）上报了 SVE2 却无法执行，Mat.convertTo 直接 SIGILL。
    // 4.11 起的 classes.jar 是 Java 17 字节码（major 61），AGP 4.1 的 D8 读不了，故停在 4.10.0。
    implementation 'org.opencv:opencv:4.10.0'

    // 相机：预览 + 逐帧分析 + 高分辨率拍照
    implementation "androidx.camera:camera-core:${cameraXVersion}"
    implementation "androidx.camera:camera-camera2:${cameraXVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraXVersion}"
    implementation "androidx.camera:camera-view:${cameraXVersion}"
    // CameraX 的 getInstance() 返回 guava 的 ListenableFuture，而 camera-view 经
    // media3 只在运行时段引入 guava（编译期被替换为空的 listenablefuture 桩）。
    // 这里显式声明同一版本，让编译期能看到该接口。
    implementation 'com.google.guava:guava:31.0.1-android'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.android.material:material:1.5.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    // AndroidJUnitRunner：ScanSession 的落盘/恢复依赖真实 Context，只能在 instrumentation 里跑
    androidTestImplementation 'androidx.test:runner:1.5.2'
    // ActivityScenario：首页历史列表要在真实 Activity 里跑一遍
    androidTestImplementation 'androidx.test:core:1.5.0'
}
